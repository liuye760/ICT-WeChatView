<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>码道小助手</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    background: #e5e5e5;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  }

  .phone {
    width: 375px;
    height: 720px;
    display: flex;
    flex-direction: column;
    background: #ededed;
    overflow: hidden;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.18);
  }

  .titlebar {
    flex: none;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    background: #ededed;
    border-bottom: 1px solid #d9d9d9;
  }

  .titlebar .title {
    font-size: 17px;
    font-weight: 500;
    color: #000;
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 12px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    align-items: flex-start;
  }

  .msg.me {
    justify-content: flex-end;
  }

  .bubble {
    max-width: 68%;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 15px;
    line-height: 1.5;
    color: #000;
    word-break: break-word;
  }

  .msg.other .bubble {
    background: #fff;
  }

  .msg.me .bubble {
    background: #95ec69;
  }
</style>
</head>
<body>
  <div class="phone">
    <header class="titlebar">
      <span class="title">码道小助手</span>
    </header>

    <main class="chat">
      <div class="msg other">
        <div class="bubble">在吗？</div>
      </div>
      <div class="msg me">
        <div class="bubble">在的，怎么啦？</div>
      </div>
    </main>
  </div>
</body>
</html>
